<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="4"/>

  <!-- Orbital Rings (representing atom / quantum mechanics / physics) -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.35" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.35" transform="rotate(30 256 256)"/>

  <!-- Central Shield / Hexagon -->
  <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" fill="rgba(15, 23, 42, 0.9)" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Stylized "JEE" typography -->
  <text x="256" y="240" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">JEE</text>

  <!-- 2027 badge -->
  <rect x="186" y="260" width="140" height="34" rx="17" fill="url(#accentGrad)"/>
  <text x="256" y="284" font-family="system-ui, -apple-system, 'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#020617" text-anchor="middle" letter-spacing="2">2027</text>

  <!-- NTA CBT & AI Sparkle Indicator -->
  <path d="M256,320 L260,332 L272,336 L260,340 L256,352 L252,340 L240,336 L252,332 Z" fill="#38bdf8"/>
  <text x="256" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TRACKPREP • AI</text>
</svg>
